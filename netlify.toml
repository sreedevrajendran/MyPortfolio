[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NETLIFY_SKIP_NEXTJS_RUNTIME = "true"

[functions]
  directory = "netlify/functions"

# API Chat Redirect to Netlify serverless function
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# 301 Redirects: Enforce canonical URL (https://sreedevrajendran.in)
# Redirect www (HTTPS) → non-www (HTTPS)
[[redirects]]
  from = "https://www.sreedevrajendran.in/*"
  to   = "https://sreedevrajendran.in/:splat"
  status = 301
  force  = true

# Redirect www (HTTP) → non-www (HTTPS)
[[redirects]]
  from = "http://www.sreedevrajendran.in/*"
  to   = "https://sreedevrajendran.in/:splat"
  status = 301
  force  = true

# Redirect plain HTTP → HTTPS
[[redirects]]
  from = "http://sreedevrajendran.in/*"
  to   = "https://sreedevrajendran.in/:splat"
  status = 301
  force  = true

# HTTP Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https:; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

